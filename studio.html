<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360° 全景展示工作台</title>
<style>
:root{
  --sd-bg:#0f1115; --sd-bg2:#171a21; --sd-bg3:#1f242d; --sd-bg4:#272d38;
  --sd-line:#2b323d; --sd-line2:#39414f;
  --sd-fg:#e8ecf3; --sd-fg2:#9aa5b6; --sd-fg3:#6b7686;
  --sd-accent:#4f8ef7; --sd-accent2:#3a6fd0; --sd-ok:#38b26a; --sd-warn:#e0a83c; --sd-err:#e05a5a;
  --sd-radius:7px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--sd-bg); color:var(--sd-fg);
  font:13px/1.55 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#333b47;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#454e5d;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
#topbar{
  display:flex; align-items:center; gap:10px; padding:0 14px; height:52px;
  background:var(--sd-bg2); border-bottom:1px solid var(--sd-line); flex:none;
}
#brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;letter-spacing:.2px}
#brand .logo{
  width:26px;height:26px;border-radius:7px;flex:none;
  background:linear-gradient(135deg,#4f8ef7,#8b5cf6);
  display:grid;place-items:center;font-size:14px;
}
#brand small{font-weight:400;color:var(--sd-fg3);font-size:11px;margin-left:2px}
.topbar-sep{width:1px;height:24px;background:var(--sd-line);margin:0 4px}
.topbar-spacer{flex:1}

.btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  background:var(--sd-bg3); border:1px solid var(--sd-line2); border-radius:var(--sd-radius);
  cursor:pointer; white-space:nowrap; transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--sd-bg4);border-color:#48515f}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sd-accent);border-color:var(--sd-accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--sd-accent2);border-color:var(--sd-accent2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sd-fg2)}
.btn.ghost:hover{background:var(--sd-bg3);color:var(--sd-fg)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:disabled{background:var(--sd-bg3);border-color:var(--sd-line2);color:var(--sd-fg3)}

select,input[type=text],input[type=number],textarea{
  background:var(--sd-bg); border:1px solid var(--sd-line2); border-radius:6px;
  padding:5px 8px; outline:none;
}
select:focus,input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:var(--sd-accent)}

/* ---------- 主体三栏 ---------- */
#workspace{flex:1;display:grid;grid-template-columns:268px minmax(0,1fr) 312px;overflow:hidden}

.col{display:flex;flex-direction:column;overflow:hidden;background:var(--sd-bg2)}
#col-left{border-right:1px solid var(--sd-line)}
#col-right{border-left:1px solid var(--sd-line);background:var(--sd-bg2)}
.col-head{
  display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;flex:none;
  border-bottom:1px solid var(--sd-line); font-size:12px; font-weight:600;
  color:var(--sd-fg2); letter-spacing:.4px;
}
.col-head .spacer{flex:1}
.col-body{flex:1;overflow-y:auto;overflow-x:hidden}

/* ---------- 列表行（书页列表复用） ---------- */
.lot-bar-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px 6px;
  font-size:12px;font-weight:600;color:var(--sd-fg2);
}
.lot-bar-head .spacer{flex:1}
.lot-row{
  display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;
  cursor:pointer;border:1px solid transparent;
}
.lot-row:hover{background:var(--sd-bg3)}
.lot-row.on{background:var(--sd-bg4);border-color:var(--sd-accent)}
.lot-cover{
  width:38px;height:38px;flex:none;border-radius:5px;overflow:hidden;background:var(--sd-bg);
  border:1px solid var(--sd-line);display:grid;place-items:center;font-size:10px;color:var(--sd-fg3);
}
.lot-cover img{width:100%;height:100%;object-fit:cover;display:block}
.lot-meta{flex:1;min-width:0;line-height:1.35}
.lot-meta b{display:block;font-size:12px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lot-meta i{display:block;font-size:10px;color:var(--sd-fg3);font-style:normal}
.lot-ops{display:flex;gap:2px;opacity:.3;transition:opacity .15s}
.lot-row:hover .lot-ops{opacity:1}
.lot-ops .btn{height:22px;padding:0 6px;font-size:11px}

/* ---------- 素材面板 ---------- */
#dropzone{
  margin:12px; padding:18px 12px; border:1.5px dashed var(--sd-line2); border-radius:var(--sd-radius);
  text-align:center; color:var(--sd-fg3); cursor:pointer; transition:.15s; background:var(--sd-bg3);
}
#dropzone:hover,#dropzone.over{border-color:var(--sd-accent);color:var(--sd-fg2);background:var(--sd-bg4)}
#dropzone .big{font-size:22px;display:block;margin-bottom:6px;opacity:.8}
#dropzone .hint{font-size:11px;margin-top:4px;color:var(--sd-fg3);line-height:1.5}
.mat-actions{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.mat-actions .btn{flex:1;justify-content:center;min-width:64px}
#matStats{padding:0 12px 8px;font-size:11px;color:var(--sd-fg3);line-height:1.6}
#matStats b{color:var(--sd-fg2);font-weight:600}
#matList{padding:0 8px 14px}
.mat-group{margin-bottom:10px}
.mat-group-title{
  display:flex;align-items:center;gap:6px;padding:4px 6px;font-size:11px;color:var(--sd-fg3);
  font-weight:600;letter-spacing:.3px;
}
.mat-group-title .tag{
  background:var(--sd-bg4);border-radius:4px;padding:1px 6px;color:var(--sd-fg2);font-weight:600;
}
.mat-items{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mat-item{
  position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;background:var(--sd-bg3);
  border:1px solid var(--sd-line);cursor:pointer;
}
.mat-item img{width:100%;height:100%;object-fit:contain;display:block;background:#0b0d11}
.mat-item .idx{
  position:absolute;left:0;bottom:0;background:rgba(0,0,0,.72);color:#fff;
  font-size:9px;padding:0 4px;border-top-right-radius:4px;line-height:14px;
}
.mat-item.is-off{opacity:.32}
.mat-item.is-off::after{
  content:"已排除";position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(0,0,0,.55);font-size:10px;color:#fff;
}
.mat-empty{color:var(--sd-fg3);font-size:12px;text-align:center;padding:18px 12px;line-height:1.7}

/* ---------- 中间：预览 ---------- */
#col-center{background:var(--sd-bg);position:relative;display:flex;flex-direction:column}
#stage-toolbar{
  display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;flex:none;
  border-bottom:1px solid var(--sd-line);background:var(--sd-bg2);font-size:12px;color:var(--sd-fg2);
}
#stage-toolbar .spacer{flex:1}
.swatch{width:20px;height:20px;border-radius:5px;border:1px solid var(--sd-line2);cursor:pointer}
.swatch.on{outline:2px solid var(--sd-accent);outline-offset:1px}
#stage-wrap{flex:1;overflow:auto;display:grid;place-items:center;padding:20px;min-height:0}
#stage-frame{
  position:relative;box-shadow:0 8px 40px rgba(0,0,0,.5);border-radius:4px;overflow:hidden;
  background:#fff; transition:width .1s;
}
#stage-frame.checker{
  background-image:linear-gradient(45deg,#d8d8d8 25%,transparent 25%),
                   linear-gradient(-45deg,#d8d8d8 25%,transparent 25%),
                   linear-gradient(45deg,transparent 75%,#d8d8d8 75%),
                   linear-gradient(-45deg,transparent 75%,#d8d8d8 75%);
  background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;background-color:#f2f2f2;
}
#stage-host{width:100%;height:100%}
#stage-empty{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:#8b95a5;background:#1a1e26;font-size:13px;line-height:1.8;padding:20px;
}
#stage-empty .big{font-size:34px;display:block;margin-bottom:10px;opacity:.55}
#stage-empty.hide{display:none}

/* 代码抽屉 */
#codepane{flex:none;border-top:1px solid var(--sd-line);background:var(--sd-bg2);display:flex;flex-direction:column}
#codepane-head{
  display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;flex:none;cursor:pointer;
  font-size:12px;color:var(--sd-fg2);user-select:none;
}
#codepane-head:hover{background:var(--sd-bg3)}
#codepane-head .spacer{flex:1}
#codepane-head .chev{transition:transform .18s;display:inline-block;font-size:10px}
#codepane.open #codepane-head .chev{transform:rotate(90deg)}
#codepane-body{height:0;overflow:hidden;transition:height .18s ease}
#codepane.open #codepane-body{height:300px}
#codebox{
  width:100%;height:100%;border:0;border-top:1px solid var(--sd-line);background:#0b0d11;
  color:#c8d3e3;font:12px/1.6 Consolas,"Cascadia Mono",Menlo,monospace;
  padding:10px 12px;resize:none;outline:none;white-space:pre;overflow:auto;
}

/* ---------- 右侧参数面板 ---------- */
.pgroup{border-bottom:1px solid var(--sd-line)}
.pgroup-head{
  display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--sd-fg2);user-select:none;
}
.pgroup-head:hover{background:var(--sd-bg3)}
.pgroup-head .chev{transition:transform .18s;font-size:10px;color:var(--sd-fg3)}
.pgroup.open .pgroup-head .chev{transform:rotate(90deg)}
.pgroup-head .cnt{
  margin-left:auto;font-size:10px;color:var(--sd-fg3);background:var(--sd-bg3);
  padding:1px 6px;border-radius:9px;font-weight:400;
}
.pgroup-body{display:none;padding:4px 12px 14px}
.pgroup.open .pgroup-body{display:block}

.prow{display:flex;align-items:center;gap:10px;padding:5px 0;min-height:30px}
.prow label{flex:1;color:var(--sd-fg2);font-size:12px;cursor:default;min-width:0}
.prow label .sub{display:block;font-size:10px;color:var(--sd-fg3);line-height:1.4;margin-top:1px}
.prow .ctl{flex:none;display:flex;align-items:center;gap:6px}
.prow input[type=text],.prow input[type=number],.prow select{width:132px}
.prow input[type=number]{width:76px;text-align:right}
.prow input[type=color]{width:40px;height:26px;padding:1px;border:1px solid var(--sd-line2);border-radius:5px;background:var(--sd-bg);cursor:pointer}
.prow.wide{display:block}
.prow.wide textarea{width:100%;height:56px;margin-top:4px;font-family:Consolas,monospace;font-size:11px;resize:vertical}

.switch{position:relative;width:38px;height:21px;flex:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{
  position:absolute;inset:0;background:var(--sd-bg4);border-radius:11px;
  transition:background .16s;border:1px solid var(--sd-line2);
}
.switch .track::after{
  content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#8d97a7;transition:transform .16s,background .16s;
}
.switch input:checked + .track{background:var(--sd-accent);border-color:var(--sd-accent)}
.switch input:checked + .track::after{transform:translateX(17px);background:#fff}

.tri{display:inline-flex;background:var(--sd-bg);border:1px solid var(--sd-line2);border-radius:6px;overflow:hidden}
.tri button{
  background:transparent;border:0;padding:4px 9px;cursor:pointer;color:var(--sd-fg3);font-size:11px;min-width:34px;
}
.tri button:hover{background:var(--sd-bg3);color:var(--sd-fg2)}
.tri button.on{background:var(--sd-accent);color:#fff;font-weight:600}

/* ---------- 状态栏 ---------- */
#statusbar{
  flex:none;height:28px;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--sd-bg2);border-top:1px solid var(--sd-line);font-size:11px;color:var(--sd-fg3);
}
#statusbar .spacer{flex:1}
#statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--sd-ok);display:inline-block;margin-right:5px}
#statusbar .dot.warn{background:var(--sd-warn)}
#statusbar .dot.err{background:var(--sd-err)}

/* ---------- 通知 ---------- */
#toasts{position:fixed;right:16px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:90;pointer-events:none}
.toast{
  background:var(--sd-bg4);border:1px solid var(--sd-line2);border-left:3px solid var(--sd-accent);
  border-radius:6px;padding:9px 13px;max-width:340px;box-shadow:0 8px 26px rgba(0,0,0,.5);
  animation:tin .18s ease;font-size:12px;
}
.toast.ok{border-left-color:var(--sd-ok)}
.toast.warn{border-left-color:var(--sd-warn)}
.toast.err{border-left-color:var(--sd-err)}
.toast b{display:block;margin-bottom:2px}
.toast span{color:var(--sd-fg2);font-size:11px;line-height:1.5}
@keyframes tin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- 弹窗 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:100}
.modal{
  background:var(--sd-bg2);border:1px solid var(--sd-line2);border-radius:10px;
  width:min(560px,92vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.65);
}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--sd-line);font-weight:600}
.modal-head .spacer{flex:1}
.modal-body{padding:16px 18px;overflow:auto;line-height:1.75;color:var(--sd-fg2);font-size:12.5px}
.modal-body h4{color:var(--sd-fg);margin:16px 0 6px;font-size:13px}
.modal-body h4:first-child{margin-top:0}
.modal-body code{background:var(--sd-bg);padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:11.5px;color:#9ec3ff}
.modal-body ol,.modal-body ul{margin:6px 0;padding-left:20px}
.modal-body li{margin:3px 0}
.modal-foot{padding:12px 18px;border-top:1px solid var(--sd-line);display:flex;gap:8px;justify-content:flex-end}
.mini-note{font-size:11px;color:var(--sd-fg3);padding:6px 12px 10px;line-height:1.6}
</style>
</head>
<body>

<header id="topbar">
  <div id="brand">
    <span class="logo">◎</span>
    <span>360° 全景展示工作台<small>Cloudimage 360 View 4.10.0</small></span>
    <span id="verTag" title="构建时间，用来确认浏览器用的是不是最新版工作台"
      style="margin-left:10px;font-size:11px;color:#7f8896;border:1px solid var(--sd-line);border-radius:4px;padding:2px 6px">v09-16 23:16</span>
  </div>
  <div class="topbar-sep"></div>
  <label style="color:var(--sd-fg2);font-size:12px">页面类型</label>
  <select id="pageType" style="width:132px">
    <option value="single">单品 360 展示</option>
    <option value="book">翻书图录（电子图册）</option>
  </select>
  <div class="topbar-sep"></div>
  <label style="color:var(--sd-fg2);font-size:12px">页面模板</label>
  <select id="tplSelect" style="width:150px"></select>
  <label style="color:var(--sd-fg2);font-size:12px">参数预设</label>
  <select id="presetSelect" style="width:190px"></select>
  <div class="topbar-sep"></div>
  <button class="btn ghost sm" id="btnHelp">使用说明</button>
  <button class="btn ghost sm" id="btnWipeStore" title="清除浏览器里自动保存的工程">清空本地工程</button>
  <div class="topbar-spacer"></div>
  <button class="btn sm" id="btnCheckup" title="检查图片尺寸是否一致、帧数够不够、有没有超大的图">体检</button>
  <button class="btn sm" id="btnImportCfg">导入配置</button>
  <button class="btn sm" id="btnExportCfg">导出配置</button>
  <button class="btn primary" id="btnExport">导出 HTML</button>
</header>

<main id="workspace">

  <!-- 左：素材 -->
  <aside class="col" id="col-left">
    <div class="col-head">
      <span>素材</span>
      <span class="spacer"></span>
      <button class="btn ghost sm" id="btnSortName" title="按文件名自然排序">重排</button>
      <button class="btn ghost sm" id="btnClearMat" title="清空素材">清空</button>
    </div>
    <div class="col-body">
      <div id="bookBar" style="display:none">
        <div class="lot-bar-head">
          <span>书页</span>
          <span class="spacer"></span>
          <button class="btn ghost sm" id="btnAddPage">＋ 加页</button>
        </div>
        <div id="bookList"></div>
        <div style="display:flex;gap:6px;padding:0 12px 10px">
          <button class="btn sm" id="btnUpCover" style="flex:1;justify-content:center">上传封面</button>
          <button class="btn sm" id="btnUpBack" style="flex:1;justify-content:center">上传封底</button>
        </div>
        <div style="padding:0 12px 10px">
          <button class="btn sm" id="btnUpPage" style="width:100%;justify-content:center">上传本页图片</button>
        </div>
        <div style="padding:10px 12px;border-top:1px solid var(--sd-line)">
          <div style="font-size:12px;color:var(--sd-fg2);margin-bottom:6px">
            本页 360 素材<span style="color:var(--sd-fg3)">（成品里点这一页就会弹出）</span>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn sm" id="btnUpPage360X" style="flex:1;justify-content:center">＋ 水平转动</button>
            <button class="btn sm" id="btnUpPage360Y" style="flex:1;justify-content:center">＋ 垂直俯仰</button>
          </div>
          <div id="page360List" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px"></div>
          <div id="page360Hint" style="font-size:11px;color:var(--sd-fg3);margin-top:6px"></div>
        </div>
        <div class="mini-note" id="bookHint"></div>
      </div>
      <!-- 书模式下整块收起（素材直接挂在内容页上）；单品时照旧 -->
      <div id="matPanel">
        <div style="padding:8px 12px 4px;font-size:12px;color:var(--sd-fg3)">
          素材（当前页面的 360 图）
        </div>
      <div id="dropzone">
        <span class="big">🖼</span>
        <div>拖拽图片到此处</div>
        <div class="hint">或点击选择文件 / 选择文件夹<br>支持任意帧数（6 张也能用）</div>
      </div>
      <div class="mat-actions">
        <button class="btn sm" id="btnPickFiles">选择图片</button>
        <button class="btn sm" id="btnPickDir">选择文件夹</button>
        <button class="btn sm" id="btnDemo">载入示例</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:0 12px 10px;font-size:11px;color:var(--sd-fg3)">
        <span>导入到</span>
        <div class="tri" id="axisPick">
          <button type="button" class="on" data-axis="x">水平旋转</button>
          <button type="button" data-axis="y">垂直俯仰</button>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
      <div id="matStats"></div>
      <div id="matList"></div>
      </div><!-- /#matPanel -->
    </div>
  </aside>

  <!-- 中：预览 -->
  <section class="col" id="col-center">
    <div id="stage-toolbar">
      <span>预览</span>
      <div class="topbar-sep"></div>
      <label style="color:var(--sd-fg3);font-size:11px">背景</label>
      <div class="swatch checker on" data-bg="checker" title="透明棋盘"></div>
      <div class="swatch" data-bg="#ffffff" style="background:#fff" title="白色"></div>
      <div class="swatch" data-bg="#000000" style="background:#000" title="黑色"></div>
      <div class="swatch" data-bg="#f5f6f8" style="background:#f5f6f8" title="浅灰"></div>
      <div class="topbar-sep"></div>
      <label style="color:var(--sd-fg3);font-size:11px">宽</label>
      <input type="number" id="stageW" value="520" min="120" max="2400" style="width:70px;text-align:right">
      <span style="color:var(--sd-fg3);font-size:11px">px</span>
      <div class="topbar-sep"></div>
      <button class="btn ghost sm" id="btnAutoRatio" title="按素材实际宽高比设置">自适应比例</button>
      <div class="topbar-sep"></div>

  var bootId = null;

  function ping() {
    if (checked) return Promise.resolve(serverOk);
    return fetch('/@ping', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        checked = true;
        serverOk = !!(j && j.ok);
        if (serverOk) bootId = j.boot || 'unknown';
        return serverOk;
      })
      .catch(function () { checked = true; serverOk = false; return false; });
  }

  /* 服务是否重启过（重启后内存里的素材全丢，URL 会 404） */
  function checkRestart() {
    return fetch('/@ping', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.ok) return false;
        var now = j.boot || 'unknown';
        var changed = (bootId !== null && now !== bootId);
        bootId = now;
        return changed;
      })
      .catch(function () { return false; });
  }

  function isServer() { return serverOk; }
  function isFileMode() { return location.protocol === 'file:'; }

  function clearServer() {
    if (!serverOk) return Promise.resolve();
    return fetch('/@mat', { method: 'DELETE' }).catch(function () {});
  }

  function safeName(name) {
    return String(name || 'frame').replace(/[\\\/:*?"<>|]+/g, '_');
  }

  /* ---------- 读图 ---------- */
  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { resolve({ img: img, objUrl: url }); };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('无法读取图片：' + file.name));
      };
      img.src = url;
    });
  }

  /* ---------- 单张：降采样 + 上传 ---------- */
  function upload(file, axis) {
    return loadImage(file).then(function (o) {
      var img = o.img;
      var scale = Math.min(1, PREVIEW_MAX_EDGE / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));

      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);

      var meta = {
        name: file.name,
        w: img.width, h: img.height,
        previewW: w, previewH: h,
        file: file,
        off: false,
        axis: axis === 'y' ? 'y' : 'x'
      };

      return new Promise(function (resolve) {
        cv.toBlob(function (blob) {
          if (!blob) { URL.revokeObjectURL(o.objUrl); resolve(meta); return; }
          fetch('/@upload', {
            method: 'POST',
            headers: { 'X-File-Name': encodeURIComponent(safeName(file.name)) },
            body: blob
          })
            .then(function (r) { return r.json(); })
            .then(function (j) {
              meta.url = j.url;
              URL.revokeObjectURL(o.objUrl);
              resolve(meta);
            })
            .catch(function () {
              URL.revokeObjectURL(o.objUrl);
              resolve(meta);
            });
        }, 'image/png');
      });
    });
  }

  /* ---------- 批量导入（按文件名自然排序，串行上传以免打爆内存） ---------- */
  function importFiles(files, axis, onProgress) {
    var list = Array.prototype.slice.call(files).filter(function (f) {
      return /^image\//.test(f.type) ||
             /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name);
    });
    if (!list.length) return Promise.resolve([]);

    list.sort(function (a, b) {
      return String(a.name).localeCompare(String(b.name), 'zh-Hans-CN',
        { numeric: true, sensitivity: 'base' });
    });

    var out = [];
    var chain = Promise.resolve();
    list.forEach(function (f, i) {
      chain = chain.then(function () {
        if (onProgress) onProgress(i + 1, list.length, f.name);
        return upload(f, axis).then(function (m) { out.push(m); });
      });
    });
    return chain.then(function () { return out; });
  }

  /* ---------- 生成示例素材（无素材时可直接看效果） ---------- */
  function demoItems() {
    return new Promise(function (resolve) {
      var colors = ['#d94141', '#2fae63', '#2f6fd0', '#d9a72f', '#9a3fd0', '#2fa9b8'];
      var labels = ['前', '右', '后', '左', '上', '下'];
      var out = [];
      var chain = Promise.resolve();
      labels.forEach(function (lb, i) {
        chain = chain.then(function () {
          var cv = document.createElement('canvas');
          cv.width = 480; cv.height = 360;
          var x = cv.getContext('2d');
          x.fillStyle = colors[i]; x.fillRect(0, 0, 480, 360);
          x.fillStyle = 'rgba(255,255,255,.95)';
          x.font = 'bold 110px "Microsoft YaHei",sans-serif';
          x.textAlign = 'center'; x.textBaseline = 'middle';
          x.fillText(lb, 240, 165);
          x.font = '22px "Microsoft YaHei",sans-serif';
          x.fillStyle = 'rgba(255,255,255,.78)';
          x.fillText('第 ' + (i + 1) + ' / 6 帧', 240, 268);

          return new Promise(function (res) {
            cv.toBlob(function (blob) {
              var nm = 'frame-' + (i + 1) + '.png';
              var meta = { name: nm, w: 480, h: 360,
                           previewW: 480, previewH: 360, off: false,
                           axis: i < 4 ? 'x' : 'y',
                           /* 存一份 File，这样刷新后也能被自动恢复 */
                           file: blob ? new File([blob], nm, { type: 'image/png' }) : null };
              if (!serverOk || !blob) { res(meta); return; }
              fetch('/@upload', {
                method: 'POST',
                headers: { 'X-File-Name': encodeURIComponent(meta.name) },
                body: blob
              }).then(function (r) { return r.json(); })
                .then(function (j) { meta.url = j.url; res(meta); })
                .catch(function () { res(meta); });
            }, 'image/png');
          });
        });
        chain = chain.then(function (m) { out.push(m); });
      });
      chain.then(function () { resolve(out); });
    });
  }

  return {
    ping: ping,
    checkRestart: checkRestart,
    isServer: isServer,
    isFileMode: isFileMode,
    clearServer: clearServer,
    importFiles: importFiles,
    demoItems: demoItems,
    PREVIEW_MAX_EDGE: PREVIEW_MAX_EDGE
  };
})();

/* =====================================================================
 * 04-preview.js —— 实时预览（同文档真实渲染）
 *
 * 为什么不用 iframe.srcdoc：实测 CI360 在 srcdoc 文档里完全不渲染。
 * 另外库不支持参数热更新，所以每次改动都 destroyAll() + 清空容器 + 重新 init()。
 * ===================================================================== */
window.SD = window.SD || {};

SD.Preview = (function () {
  var host = null;
  var timer = null;
  var mounted = false;
  var blobUrl = null;      /* 整页预览用的 blob URL，替换时要回收 */

  function mount(el) {
    host = el;
    mounted = true;
  }

  function destroy() {
    try {
      var ci = (typeof window.CI360 === 'function') ? new window.CI360() : window.CI360;
      if (ci && ci.destroyAll) ci.destroyAll();
    } catch (e) { /* 尚未初始化过，忽略 */ }
    if (host) host.innerHTML = '';
    if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch (e) {} blobUrl = null; }
  }

  function render(state) {
    if (!mounted || !host) return;
    destroy();

    /* 翻书图录：整页交给 iframe，布局所见即所得 */
    if (state.pageType === 'book' && SD.BookPage) {
      var gen = SD.BookPage;
      if (gen) {
      /* 必须用 blob URL 而不是 srcdoc：
         srcdoc 文档的 origin 是 about:srcdoc，CI360 强制 crossOrigin="anonymous"，
         图片与查看器在那样的文档里都不会渲染（表现为预览一片空白）。
         blob: 地址带真实 origin，与页面同源，图片和库都能正常加载。 */
      var html = gen.buildHtml(state, {
        mode: 'preview',
        libHref: location.origin + '/lib/360-view.min.js'
      });
      /* 相对路径（./lib/...）在 blob 文档里会解析错，补一个 base 指向服务根 */
      var baseHref = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
      if (html.indexOf('<head>') >= 0) {
        html = html.replace('<head>', '<head><base href="' + baseHref + '">');
      }
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      blobUrl = URL.createObjectURL(blob);
      var box = document.createElement('iframe');
      box.setAttribute('title', '预览');
      box.style.cssText = 'width:100%;height:100%;border:0;display:block;background:#f5f2ec';
      box.src = blobUrl;
      host.appendChild(box);
      if (SD.ShowEmpty) SD.ShowEmpty(false);
      return;
      }
    }

    var cfg;
    try {
      cfg = SD.Codegen.buildConfig(state, { mode: 'preview' });
    } catch (e) {
      SD.status('预览配置生成失败：' + (e && e.message), 'err');
      return;
    }

    var list = cfg.imageListX || [];
    if (!list.length) {
      if (SD.ShowEmpty) SD.ShowEmpty(true);
      return;
    }
    if (SD.ShowEmpty) SD.ShowEmpty(false);

    var el = document.createElement('div');
    el.className = 'cloudimage-360';
    el.id = 'viewer';
    el.style.cssText = 'width:100%;height:100%';
    host.appendChild(el);

    try {
      var ci = (typeof window.CI360 === 'function') ? new window.CI360() : window.CI360;
      ci.init(el, cfg);
    } catch (e) {
      SD.status('预览初始化失败：' + (e && e.message), 'err');
    }
  }

  function schedule(state, delay) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      render(state);
    }, delay === undefined ? 220 : delay);
  }

  return { mount: mount, destroy: destroy, render: render, schedule: schedule };
})();

/* =====================================================================
 * 05-codegen.js —— 产物 HTML 代码生成
 *
 * 同一份生成逻辑同时服务「预览」「导出」，保证所见即所得。
 * 两个实测结论固化在这里：
 *   1) 4.10.0 把「实例」挂到 window.CI360，不能照抄 README 的 new CI360()
 *   2) 库只认普通 HTTP URL，所以预览用上传后的 /@mat/... URL，
 *      产出物则用 folder + filenameX 指向 images/ 目录
 * ===================================================================== */
window.SD = window.SD || {};

SD.Codegen = (function () {

  var LIB_HREF = './lib/360-view.min.js';
  var LIB_CDN = 'https://cdn.cloudimage.io/360-view/4.10.0/360-view.min.js';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* JSON → 可安全放进 <script> 的字面量 */
  function safeJson(obj, pretty) {
    var t = JSON.stringify(obj, null, pretty ? 2 : 0);
    return (t === undefined ? '{}' : t).replace(/<\//g, '<\\/');
  }

  function parseList(txt) {
    if (!txt) return [];
    return String(txt).split(/\r?\n/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  /* 当前生效的素材（排除被手动剔除的帧） */
  function activeItems(state) {
    var m = state.materials || {};
    return (m.items || []).filter(function (it) { return !it.off; });
  }

  /* ---------- 打开方式守卫 ----------
     双击 index.html 会以 file:// 打开，而 CI360 给每张图设了
     crossOrigin="anonymous"，file:// 下请求会被浏览器拦掉 ——
     画面退化成一个低分辨率版本且拖不动。这里直接拦下来讲清楚。 */
  function fileWarn() {
    return [
      '<div id="fileWarn" class="file-warn">',
      '  <div>',
      '    <h3>\u26a0 \u6253\u5f00\u65b9\u5f0f\u4e0d\u5bf9</h3>',
      '    <p>\u4f60\u6b63\u5728\u7528\u300c\u53cc\u51fb index.html\u300d\u7684\u65b9\u5f0f\u6253\u5f00\u9875\u9762\uff08<code>file://</code> \u534f\u8bae\uff09\u3002</p>',
      '    <p>360\u00b0 \u67e5\u770b\u5668\u5728\u8fd9\u79cd\u6a21\u5f0f\u4e0b<strong>\u65e0\u6cd5\u52a0\u8f7d\u56fe\u7247</strong>\uff0c\u753b\u9762\u4f1a\u6a21\u7cca\u3001\u4e5f\u4e0d\u80fd\u62d6\u52a8\u3002</p>',
      '    <p>\u8bf7<strong>\u5173\u95ed\u672c\u9875</strong>\uff0c\u6539\u4e3a\u53cc\u51fb\u540c\u76ee\u5f55\u4e0b\u7684 <code>\u542f\u52a8.bat</code>\u3002</p>',
      '  </div>',
      '</div>',
      '<style>',
      '.file-warn{position:fixed;inset:0;z-index:999999;display:none;place-items:center;',
      '  background:rgba(24,18,12,.94);padding:24px;text-align:center;',
      '  font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;color:#fff;}',
      '.file-warn>div{max-width:540px;background:#2b2118;border:1px solid #5a4632;',
      '  border-radius:12px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.6);}',
      '.file-warn h3{margin:0 0 14px;font-size:19px;color:#ffcf70;}',
      '.file-warn p{margin:0 0 10px;line-height:1.85;font-size:14px;color:#e8dccb;}',
      '.file-warn code{background:#1a130d;padding:1px 6px;border-radius:4px;color:#ffcf70;}',
      '.file-warn strong{color:#fff;}',
      '</style>',
      '<script>(function(){ if (location.protocol === "file:") {',
      '  var w = document.getElementById("fileWarn"); if (w) { w.style.display = "grid"; } }})();<\/script>'
    ].join('\n');
  }

  var IMAGE_KEYS = ['folder', 'filenameX', 'amountX', 'indexZeroBase',
                    'filenameY', 'amountY', 'filenameGrid',
                    'imageListX', 'imageListY', 'imageListGrid'];

  /* 最大公约数 → 把 w/h 化成 4/3、1/1 这样的比例串 */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }

  function sizeRatio(it) {
    if (!it || !it.w || !it.h) return '';
    var g = gcd(it.w, it.h);
    return (it.w / g) + '/' + (it.h / g);
  }

  function clearImageKeys(cfg) {
    IMAGE_KEYS.forEach(function (k) { delete cfg[k]; });
  }

  /* ---------- 生成 v4 配置对象 ----------
   * opts.mode:
   *   'preview' → imageListX = 上传后的真实 HTTP URL（本地服务 /@mat/...）
   *   'files'   → folder + filenameX + amountX（导出为 images/ 目录）
   *   'inline'  → imageListX = data: URL（单文件交付）
   */
  function buildConfig(state, opts) {
    opts = opts || {};
    var mode = opts.mode || 'files';
    var cfg = {};
    var p = state.params || {};

    SD.allParams().forEach(function (d) {
      var v = p[d.key];
      if (v === undefined || v === null || v === '') return;
      if (d.type === 'list') {
        var arr = parseList(v);
        if (arr.length) cfg[d.key] = arr;
        return;
      }
      if (d.type === 'tri') { cfg[d.key] = !!v; return; }
      cfg[d.key] = v;
    });

    if (SD.Hotspots) SD.Hotspots.applyTo(cfg);

    var m = state.materials || {};
    var items = activeItems(state);
    if (!items.length) return cfg;

    /* 容器比例默认跟随素材。否则 CI360 会按图片比例把 canvas 撑出视口：
       画面被放大裁切（看着发虚）+ 页面出现滚动条，拖动也会被带偏。 */
    if (!cfg.aspectRatio) {
      var autoRatio = sizeRatio(items[0]);
      if (autoRatio) cfg.aspectRatio = autoRatio;
    }

    var xs = items.filter(function (it) { return (it.axis || 'x') !== 'y'; });
    var ys = items.filter(function (it) { return it.axis === 'y'; });

    if (mode === 'files') {
      clearImageKeys(cfg);
      cfg.folder = m.folder || './images/';
      if (xs.length) {
        cfg.filenameX = m.filenameX || 'frame-{index}.jpg';
        cfg.amountX = xs.length;
        cfg.indexZeroBase = m.pad || 0;
      }
      if (ys.length) {
        cfg.filenameY = m.filenameY || 'vframe-{index}.jpg';
        cfg.amountY = ys.length;
      }
    } else if (mode === 'inline') {
      clearImageKeys(cfg);
      if (xs.length) cfg.imageListX = xs.map(function (it) { return it.dataUrl || it.name; });
      if (ys.length) cfg.imageListY = ys.map(function (it) { return it.dataUrl || it.name; });
    } else {
      clearImageKeys(cfg);
      if (xs.length) cfg.imageListX = xs.map(function (it) { return it.url || it.name; });
      if (ys.length) cfg.imageListY = ys.map(function (it) { return it.url || it.name; });
    }
    return cfg;
  }

  function initScript(cfg, opts) {
    var external = !opts || opts.external === undefined ? true : opts.external;
    var line = external
      ? '  var ci = (typeof window.CI360 === "function") ? new window.CI360() : window.CI360;'
      : '  var ci = (typeof window.CI360 === "function") ? new window.CI360() : window.CI360;';
    return [
      '(function () {',
      '  var el = document.getElementById("viewer");',
      '  var config = ' + safeJson(cfg, true) + ';',
      line,
      '  ci.init(el, config);',
      '})();'
    ].join('\n');
  }

  /* ---------- 完整产物 HTML ---------- */
  function buildHtml(state, opts) {
    opts = opts || {};
    var mode = opts.mode || 'files';

    /* 翻书图录走独立生成器 */
    if (state.pageType === 'book' && SD.BookPage) {
      return SD.BookPage.buildHtml(state, opts);
    }

    var tpl = SD.templateById(state.templateId);
    var cfg = buildConfig(state, { mode: mode });
    var title = state.title || '360° 产品展示';
    var libSrc = opts.libHref || LIB_HREF;

    var libTag = '<script src="' + esc(libSrc) + '"><\/script>';

    return [
      '<!DOCTYPE html>',
      '<html lang="zh-CN">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width,initial-scale=1">',
      '<title>' + esc(title) + '</title>',
      '<style>',
      tpl.css,
      (state.customCss || ''),
      '</style>',
      '</head>',
      '<body>',
      '',
      fileWarn(),
      '',
      tpl.body,
      '',
      '<!-- Cloudimage 360 View 4.10.0 (MIT License) -->',
      libTag,
      '<script>',
      initScript(cfg),
      '<\/script>',
      '</body>',
      '</html>',
      ''
    ].join('\n');
  }

  /* ---------- 供嵌入已有页面的片段（走 CDN） ---------- */
  function buildSnippet(state) {
    var cfg = buildConfig(state, { mode: 'files' });
    var tpl = SD.templateById(state.templateId);
    return [
      '<style>',
      tpl.css,
      '</style>',
      '<div id="viewer" class="cloudimage-360"></div>',
      '<script src="' + LIB_CDN + '"><\/script>',
      '<script>',
      initScript(cfg),
      '<\/script>'
    ].join('\n');
  }

  return {
    esc: esc,
    fileWarn: fileWarn,
    safeJson: safeJson,
    parseList: parseList,
    activeItems: activeItems,
    buildConfig: buildConfig,
    buildHtml: buildHtml,
    buildSnippet: buildSnippet,
    LIB_HREF: LIB_HREF,
    LIB_CDN: LIB_CDN
  };
})();

/* =====================================================================
 * 06-hotspots.js —— 热点可视化编辑
 *
 * CI360 的热点在 JS 配置里是数组，positions 为「帧索引 → {x, y}」映射。
 * 省略 containerSize 时坐标按百分比（0-100）解释，所以工作台直接取
 * 点击位置占舞台的百分比，所见即所得。
 * ===================================================================== */
window.SD = window.SD || {};

SD.Hotspots = (function () {
  var picking = false;
  var layer = null;

  function st() { return SD.STATE; }

  function list() {
    var s = st();
    if (!s.hotspots) s.hotspots = [];
    return s.hotspots;
  }

  function stageEl() { return document.getElementById('stage-frame'); }

  /* 当前预览停在第几帧（0-based） */
  function activeFrame() {
    try {
      var ci = (typeof window.CI360 === 'function') ? new window.CI360() : window.CI360;
      var v = ci && ci.getViewById ? ci.getViewById('viewer') : null;
      if (v && typeof v.activeImageX === 'number') return v.activeImageX;
    } catch (e) { /* 忽略 */ }
    return 0;
  }

  /* ---------- 选点层 ---------- */
  function buildLayer() {
    if (layer && layer.parentNode) return layer;
    var stage = stageEl();
    if (!stage) return null;
    layer = document.createElement('div');
    layer.id = 'hotspot-layer';
    layer.style.cssText =
      'position:absolute;inset:0;z-index:20;cursor:crosshair;display:none;' +
      'background:rgba(79,142,247,.10);outline:2px dashed rgba(79,142,247,.7);outline-offset:-2px';
    layer.addEventListener('click', onPick);
    stage.appendChild(layer);
    return layer;
  }

  function startPicking() {
    if (!buildLayer()) return;
    picking = true;
    layer.style.display = 'block';
    SD.status('加热点：在预览图上点一下要放标记的位置（Esc 取消）', 'warn');
  }

  function stopPicking() {
    picking = false;
    if (layer) layer.style.display = 'none';
  }

  function onPick(e) {
    if (!picking) return;
    var r = stageEl().getBoundingClientRect();
    var x = Math.max(0, Math.min(100, +(((e.clientX - r.left) / r.width) * 100).toFixed(2)));
    var y = Math.max(0, Math.min(100, +(((e.clientY - r.top) / r.height) * 100).toFixed(2)));
    stopPicking();
    askDetails(activeFrame(), x, y);
  }

  /* ---------- 填写内容 ---------- */
  function askDetails(frame, x, y) {
    var mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = [
      '<div class="modal" style="width:min(460px,92vw)">',
      '  <div class="modal-head"><span>新增热点</span></div>',
      '  <div class="modal-body">',
      '    <p style="margin:0 0 10px">位置：第 <b>' + (frame + 1) + '</b> 帧，',
      '       x <b>' + x + '%</b>，y <b>' + y + '%</b></p>',
      '    <label style="display:block;margin-bottom:10px">',
      '      <span style="font-size:12px;color:var(--sd-fg2)">标记标题（时间轴上会显示）</span>',
      '      <input type="text" id="hsLabel" placeholder="例如：瓶口细节" ' +
      '        style="width:100%;margin-top:4px">',
      '    </label>',
      '    <label style="display:block">',
      '      <span style="font-size:12px;color:var(--sd-fg2)">弹窗内容（可写 HTML）</span>',
      '      <textarea id="hsBody" style="width:100%;height:78px;margin-top:4px" ' +
      '        placeholder="例如：&lt;b&gt;手工描金&lt;/b&gt;&lt;p&gt;口径 8cm，纯手工绘制&lt;/p&gt;"></textarea>',
      '    </label>',
      '  </div>',
      '  <div class="modal-foot">',
      '    <button class="btn" data-cancel>取消</button>',
      '    <button class="btn primary" data-ok>添加</button>',
      '  </div>',
      '</div>'
    ].join('\n');
    document.body.appendChild(mask);

    setTimeout(function () {
      var i = document.getElementById('hsLabel');
      if (i) i.focus();
    }, 30);

    function close() { if (mask.parentNode) mask.parentNode.removeChild(mask); }

    mask.addEventListener('click', function (e) {
      if (e.target === mask || e.target.hasAttribute('data-cancel')) { close(); return; }
      if (e.target.hasAttribute('data-ok')) {
        var lab = (document.getElementById('hsLabel').value || '').trim();
        var body = (document.getElementById('hsBody').value || '').trim();
        list().push({
          id: 'hs-' + Date.now().toString(36),
          label: lab || ('热点 ' + (list().length + 1)),
          content: body,
          frame: frame,
          x: x, y: y
        });
        close();
        if (SD.refresh) SD.refresh();
        SD.toast('ok', '已添加热点', '位置：第 ' + (frame + 1) + ' 帧');
      }
    });
  }

  /* ---------- 列表管理 ---------- */
  function showList() {
    var items = list();
    var mask = document.createElement('div');
    mask.className = 'modal-mask';
    var rows = items.length
      ? items.map(function (h, i) {
          return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;' +
                 'border-bottom:1px solid var(--sd-line)">' +
                 '<span style="color:var(--sd-fg3);width:20px">' + (i + 1) + '</span>' +
                 '<span style="flex:1">' + SD.Codegen.esc(h.label) +
                 '<span style="color:var(--sd-fg3);font-size:11px"> · 第 ' + (h.frame + 1) +
                 ' 帧 · ' + h.x + '%, ' + h.y + '%</span></span>' +
                 '<button class="btn ghost sm" data-del="' + h.id + '">删除</button>' +
                 '</div>';
        }).join('\n')
      : '<p style="color:var(--sd-fg3)">还没有热点。点「添加热点」后在预览图上选位置。</p>';

    mask.innerHTML = [
      '<div class="modal" style="width:min(520px,92vw)">',
      '  <div class="modal-head"><span>热点列表（' + items.length + '）</span></div>',
      '  <div class="modal-body">' + rows + '</div>',
      '  <div class="modal-foot">',
      '    <button class="btn" data-clear>全部清空</button>',
      '    <button class="btn primary" data-close>完成</button>',
      '  </div>',
      '</div>'
    ].join('\n');
    document.body.appendChild(mask);

    function close() { if (mask.parentNode) mask.parentNode.removeChild(mask); }

    mask.addEventListener('click', function (e) {
      var del = e.target.getAttribute && e.target.getAttribute('data-del');
      if (del) {
        var arr = list();
        for (var i = 0; i < arr.length; i++) {
          if (arr[i].id === del) { arr.splice(i, 1); break; }
        }
        close();
        if (SD.refresh) SD.refresh();
        showList();
        return;
      }
      if (e.target.hasAttribute('data-clear')) {
        st().hotspots = [];
        close();
        if (SD.refresh) SD.refresh();
        SD.toast('ok', '热点已清空');
        return;
      }
      if (e.target === mask || e.target.hasAttribute('data-close')) close();
    });
  }

  /* ---------- 写进 CI360 配置 ---------- */
  function applyTo(cfg) {
    var items = list();
    if (!items.length) return cfg;
    cfg.hotspots = items.map(function (h) {
      var pos = {};
      pos[h.frame] = { x: h.x, y: h.y };
      return {
        id: h.id,
        label: h.label,
        orientation: 'x',
        positions: pos,
        content: h.content || ('<strong>' + SD.Codegen.esc(h.label) + '</strong>')
      };
    });
    return cfg;
  }

  function count() { return list().length; }

  return {
    startPicking: startPicking,
    stopPicking: stopPicking,
    showList: showList,
    applyTo: applyTo,
    count: count,
    activeFrame: activeFrame
  };
})();

/* =====================================================================
 * 07-export.js —— 导出器
 *
 * 主路径：File System Access API（showDirectoryPicker）直接把整个产物目录
 * 写到磁盘 —— 工作台跑在 http://localhost 下属于安全上下文，该 API 可用。
 * 产物结构：
 *     导出/
 *     ├─ index.html          引用 ./lib/ 与 ./images/
 *     ├─ images/             frame-1.jpg …
 *     ├─ lib/360-view.min.js
 *     ├─ lib/vysmo-flipbook.min.js
 *     ├─ serve.ps1
 *     ├─ 启动.bat
 *     └─ 使用说明.txt
 * ===================================================================== */
window.SD = window.SD || {};

SD.Export = (function () {

  function canPickDir() {
    return typeof window.showDirectoryPicker === 'function';
  }

  function extOf(name) {
    var m = /\.([a-z0-9]+)$/i.exec(String(name || ''));
    return m ? '.' + m[1].toLowerCase() : '.png';   /* 与 12-bookpage 的 extOfName 保持一致 */
  }

  /* 导出时统一重命名，保证 {index} 模板与排序都可靠 */
  function planNames(items) {
    var xi = 0, yi = 0, out = [];
    for (var i = 0; i < items.length; i++) {
      var ext = extOf(items[i].name);
      if (items[i].axis === 'y') { yi++; out.push('vframe-' + yi + ext); }
      else { xi++; out.push('frame-' + xi + ext); }
    }
    return out;
  }

  function batContent(openFile, port) {
    return [
      '@echo off',
      'cd /d "%~dp0"',
      'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0serve.ps1" -Port ' + (port || 8790) +
        ' -Open "' + openFile + '"',
      'echo.',
      'echo Server stopped.',
      'pause',
      ''
    ].join('\r\n');
  }

  function readmeText(state, count, names) {
    return [
      '360° 产品展示 —— 使用说明',
      '========================================',
      '',
      '【怎么打开】',
      '  直接双击 index.html 通常看不到图片：Cloudimage 360 View 会给每张图',
      '  设置 crossOrigin="anonymous"，浏览器在 file:// 协议下会拦掉这些请求。',
      '  请改为双击 启动.bat —— 它会用 Windows 自带的 PowerShell 起一个本地',
      '  服务并自动打开浏览器（不需要安装任何东西，也不需要管理员权限）。',
      '',
      '【目录说明】',
      '  index.html            展示页面（不要改名）',
      '  images/               图片素材，共 ' + count + ' 张',
      '  lib/360-view.min.js   360 查看器库（Cloudimage 360 View 4.10.0，MIT）',
      '  lib/vysmo-flipbook.min.js 翻页库（@vysmo/flipbook 0.5.0，MIT）',
      '  serve.ps1             本地服务脚本（由 启动.bat 调用）',
      '  启动.bat              双击即可预览',
      '',
      '【怎么放到服务器上】',
      '  把整个文件夹上传到网站目录即可，无需 PHP / Node 等运行环境。',
      '  访问 index.html 就是成品页面。',
      '',
      '【当前配置】',
      '  页面模板：' + (state.templateId || ''),
      '  素材张数：' + count,
      '  图片顺序：' + names.join('、'),
      '',
      '【手动导出时注意】',
      '  images/ 里的文件名必须与 index.html 中 filenameX 的 {index} 模板一致，',
      '  序号从 1 开始。',
      ''
    ].join('\r\n');
  }

  /* ---------- 读写辅助 ---------- */
  function fetchBytes(rel) {
    return fetch(rel, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('读取 ' + rel + ' 失败（' + r.status + '）');
      return r.arrayBuffer();
    });
  }

  async function writeIn(dir, relPath, data) {
    var parts = String(relPath).split('/');
    var name = parts.pop();
    var cur = dir;
    for (var i = 0; i < parts.length; i++) {
      cur = await cur.getDirectoryHandle(parts[i], { create: true });
    }
    var fh = await cur.getFileHandle(name, { create: true });
    var w = await fh.createWritable();
    await w.write(data);
    await w.close();
  }

  /* ---------- 主流程：写到一个用户选择的目录 ---------- */
  async function exportToDirectory(state, onProgress) {
    var items = SD.Codegen.activeItems(state);
    var isBook = state.pageType === 'book';
    if (isBook) {
      var bk0 = state.book || {};
      var nPage0 = (bk0.pages || []).filter(function (x) { return x && x.url; }).length;
      if (!(bk0.cover && bk0.cover.url) && !nPage0) {
        throw new Error('书里还没有内容：请先上传封面或内容页图片');
      }
    } else if (!items.length) {
      throw new Error('还没有素材，先导入图片或载入示例');
    }

    var names = planNames(items);
    var dir;
    try {
      dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'ci360-export' });
    } catch (e) {
      if (e && e.name === 'AbortError') return { cancelled: true };
      throw e;
    }

    var nImgs = (isBook ? (function () {
          var bk1 = state.book || {};
          var n = (bk1.cover && bk1.cover.url) ? 1 : 0;
          n += (bk1.pages || []).filter(function (x) { return x && x.url; }).length;
          n += (bk1.back && bk1.back.url) ? 1 : 0;
          return n;
        })() : items.length);
    var total = nImgs + 4;
    var step = 0;
    function tick(label) {
      step++;
      if (onProgress) onProgress(step, total, label);
    }

    /* 1) index.html —— 指向 ./images/ 与 ./lib/ */
    var xs = items.filter(function (it) { return (it.axis || 'x') !== 'y'; });
    var ys = items.filter(function (it) { return it.axis === 'y'; });
    var prev = { folder: state.materials.folder, fx: state.materials.filenameX,
                 fy: state.materials.filenameY };
    state.materials.folder = './images/';
    state.materials.pad = 0;
    if (xs.length) state.materials.filenameX = 'frame-{index}' + extOf(xs[0].name);
    if (ys.length) state.materials.filenameY = 'vframe-{index}' + extOf(ys[0].name);
    var html = SD.Codegen.buildHtml(state, { mode: 'files' });
    state.materials.folder = prev.folder;
    state.materials.filenameX = prev.fx;
    state.materials.filenameY = prev.fy;
    await writeIn(dir, 'index.html', html);
    tick('index.html');

    /* 2) images/ */
    if (isBook) {
      /* 翻书图录：书本相关图放 book/ 下，命名与页面引用保持一致 */
      var bk = state.book || {};
      var put = async function (item, rel) {
        if (!item || !item.url) return;
        var blob = item.file || await (await fetch(item.url)).blob();
        await writeIn(dir, rel, blob);
        tick(rel);
      };
      if (bk.cover && bk.cover.url) await put(bk.cover, 'book/cover' + extOf(bk.cover.name));
      for (var pi = 0; pi < (bk.pages || []).length; pi++) {
        var pg = bk.pages[pi];
        if (pg && pg.url) await put(pg, 'book/page-' + (pi + 1) + extOf(pg.name));
        /* 这一页自己的 360 素材组 → book/page-N/ 下，文件名与页面引用一致 */
        var its = (pg && pg.items) || [];
        for (var qi = 0; qi < its.length; qi++) {
          var it = its[qi];
          if (!it || it.off || !it.url) continue;
          var nm = it.name || ('frame-' + (qi + 1) + '.png');
          await put(it, 'book/page-' + (pi + 1) + '/' + nm);
        }
      }
      if (bk.back && bk.back.url) await put(bk.back, 'book/back' + extOf(bk.back.name));
    } else {
      for (var i = 0; i < items.length; i++) {
        var f = items[i].file;
        var blob = f || await (await fetch(items[i].url)).blob();
        await writeIn(dir, 'images/' + names[i], blob);
        tick(names[i]);
      }
    }

    /* 3) lib/ —— 360 查看器 + 翻页库，两个都得在：书页靠翻页库、360 靠查看器。
       少一个就有一半功能是坏的（之前这里只复制了 360，导出的书页翻不动）。 */
    var LIBS = ['360-view.min.js', 'vysmo-flipbook.min.js'];
    for (var li = 0; li < LIBS.length; li++) {
      var libBytes = await fetchBytes('lib/' + LIBS[li]);
      await writeIn(dir, 'lib/' + LIBS[li], libBytes);
      tick('lib/' + LIBS[li]);
    }

    /* 4) serve.ps1 */
    var ps = await fetchBytes('serve.ps1');
    await writeIn(dir, 'serve.ps1', ps);
    tick('serve.ps1');

    /* 5) 启动.bat + 使用说明 */
    await writeIn(dir, '启动.bat', batContent('index.html', 8790));
    await writeIn(dir, '使用说明.txt', readmeText(state, nImgs, names));

    return { ok: true, dir: dir.name, files: nImgs + 6, names: names };
  }

  /* ---------- 降级：只下载 index.html ---------- */
  function exportHtmlOnly(state) {
    var html = SD.Codegen.buildHtml(state, { mode: 'files' });
    SD.downloadFile('index.html', html, 'text/html');
    return html;
  }

  return {
    canPickDir: canPickDir,
    planNames: planNames,
    batContent: batContent,
    readmeText: readmeText,
    exportToDirectory: exportToDirectory,
    exportHtmlOnly: exportHtmlOnly
  };
})();

/* =====================================================================
 * 11-book.js —— 翻书图录：书籍数据模型与页管理
 *
 * 一本书 = 封面 + N 张内容页 + 封底，全部按统一尺寸显示。
 * 内容页可以自带一组 360 素材，点击页面即弹出查看。
 *
 * 「页」在界面上是一条虚拟序列：[封面, 页1, 页2 … 页N, 封底]，
 * 用 active 索引表示当前正在编辑的是哪一张。
 * ===================================================================== */
window.SD = window.SD || {};

SD.Book = (function () {

  function st() { return SD.STATE; }

  function book() {
    var s = st();
    if (!s.book) {
      s.book = {
        w: 900, h: 1200,          /* 整本书的统一尺寸，可自定义 */
        cover: null,              /* { url, file, name } */
        back: null,
        pages: [],                /* { url, file, name, items: [360 素材] } */
        active: 0                 /* 当前编辑的纸张索引 */
      };
    }
    if (!s.book.pages) s.book.pages = [];
    return s.book;
  }

  /* ---------- 虚拟页序列 ---------- */
  function lastIndex() { return book().pages.length + 1; }

  function sheetAt(i) {
    var b = book();
    if (i <= 0) return { kind: 'cover', index: 0, label: '封面' };
    if (i >= lastIndex()) return { kind: 'back', index: lastIndex(), label: '封底' };
    return { kind: 'page', index: i, page: b.pages[i - 1], label: '第 ' + i + ' 页' };
  }

  function activeIndex() { return book().active || 0; }
  function activeSheet() { return sheetAt(activeIndex()); }

  function setActive(i) {
    var b = book();
    b.active = Math.max(0, Math.min(lastIndex(), i));
  }

  function imageOfSheet(sh) {
    var b = book();
    if (sh.kind === 'cover') return b.cover;
    if (sh.kind === 'back') return b.back;
    return sh.page || null;
  }

  /* ---------- 页操作 ---------- */
  function addPage() {
    var b = book();
    b.pages.push({ url: '', file: null, name: '', items: [] });
    setActive(b.pages.length);
    afterChange('已新增一页');
  }

  function removePage(i) {
    var b = book();
    if (i < 0 || i >= b.pages.length) return;
    b.pages.splice(i, 1);
    setActive(Math.min(activeIndex(), lastIndex()));
    afterChange('已删除该页');
  }

  function movePage(i, dir) {
    var b = book();
    var j = i + dir;
    if (i < 0 || i >= b.pages.length || j < 0 || j >= b.pages.length) return;
    var t = b.pages[i]; b.pages[i] = b.pages[j]; b.pages[j] = t;
    setActive(j + 1);
    afterChange();
  }

  /* ---------- 本页的 360 素材组（一个内容页自带一组，点页面即可弹出） ---------- */
  function itemsOf(sh) {
    if (!sh || sh.kind !== 'page') return null;
    if (!sh.page.items) sh.page.items = [];
    return sh.page.items;
  }

  function afterChange(msg) {
    render();
    if (SD.refresh) SD.refresh();
    if (msg) SD.toast('ok', msg);
  }

  /* ---------- 左栏渲染 ---------- */
  function render() {
    var host = document.getElementById('bookList');
    var bar = document.getElementById('bookBar');
    if (!host || !bar) return;

    var isBook = st().pageType === 'book';
    bar.style.display = isBook ? '' : 'none';
    if (!isBook) return;

    var b = book();
    host.innerHTML = '';

    var rows = [];
    rows.push({ i: 0, label: '封面', sub: b.cover ? '已上传' : '未上传', img: b.cover, kind: 'cover' });
    b.pages.forEach(function (p, k) {
      rows.push({
        i: k + 1,
        label: '第 ' + (k + 1) + ' 页',
        sub: (function () {
          var n = (p.items || []).filter(function (it) { return !it.off; }).length;
          return n ? (n + ' 张 360 素材') : '未上传 360 素材';
        })(),
        img: p, kind: 'page', pi: k
      });
    });
    rows.push({ i: lastIndex(), label: '封底', sub: b.back ? '已上传' : '未上传', img: b.back, kind: 'back' });

    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'lot-row' + (r.i === activeIndex() ? ' on' : '');
      row.innerHTML =
        '<div class="lot-cover">' + (r.img && r.img.url ? '<img alt="">' : '<span>空</span>') + '</div>' +
        '<div class="lot-meta"><b></b><i></i></div>' +
        ((r.kind === 'page')
          ? '<div class="lot-ops">' +
            '<button class="btn ghost sm" data-up title="上移">↑</button>' +
            '<button class="btn ghost sm" data-down title="下移">↓</button>' +
            '<button class="btn ghost sm" data-del title="删除">✕</button>' +
            '</div>'
          : '');
      if (r.img && r.img.url) row.querySelector('.lot-cover img').src = r.img.url;
      row.querySelector('.lot-meta b').textContent = r.label;
      row.querySelector('.lot-meta i').textContent = r.sub;

      row.addEventListener('click', function (e) {
        if (e.target.closest('button')) return;
        setActive(r.i);
        render();
        if (SD.refresh) SD.refresh();
      });
      if (r.kind === 'page') {
        row.querySelector('[data-up]').addEventListener('click', function (e) {
          e.stopPropagation(); movePage(r.pi, -1);
        });
        row.querySelector('[data-down]').addEventListener('click', function (e) {
          e.stopPropagation(); movePage(r.pi, 1);
        });
        row.querySelector('[data-del]').addEventListener('click', function (e) {
          e.stopPropagation(); removePage(r.pi);
        });
      }
      host.appendChild(row);
    });
  }

  return {
    book: book,
    lastIndex: lastIndex,
    sheetAt: sheetAt,
    activeIndex: activeIndex,
    activeSheet: activeSheet,
    setActive: setActive,
    imageOfSheet: imageOfSheet,
    addPage: addPage,
    removePage: removePage,
    movePage: movePage,
    itemsOf: itemsOf,
    render: render
  };
})();

/* =====================================================================
 * 12-bookpage.js —— 翻书图录页面生成（真实卷曲翻页版）
 *
 * 一本书 = 封面 + N 张内容页 + 封底，按封面比例统一尺寸。
 *
 * 翻页机制：
 *   交给第三方库 @vysmo/flipbook（MIT）—— WebGL 连续曲面卷曲，
 *   前进与回翻走同一条卷曲管道，并支持拖拽跟手（scrub）。
 *   库随产物打包：lib/vysmo-flipbook.min.js（IIFE，经典 <script src> 可用；
 *   产物源在 build/vendor/，升级见 build/mkvysmo.js）。
 *
 * 层次：
 *   <div class="book">  翻页库的 canvas（当前页 + 翻动中的卷曲纸页）
 *   <div class="dots">  360 锚点热区（浮在书页之上）
 * ===================================================================== */
window.SD = window.SD || {};

SD.BookPage = (function () {

  function extOfName(name) {
    var m = /\.([a-z0-9]+)$/i.exec(String(name || ''));
    return m ? '.' + m[1].toLowerCase() : '.png';
  }

  /* ---------- 页序列（含封面封底） ---------- */
  function sheetList(state, mode) {
    var b = state.book || {};
    var out = [];

    function srcOf(item, fallbackName) {
      if (!item) return '';
      return (mode === 'preview') ? (item.url || '') : ('book/' + fallbackName);
    }

    /* 某个内容页自己的 360 素材组：预览用内存 URL，导出用相对文件名 */
    function itemsOf(page, pageIndex) {
      var arr = (page && page.items) || [];
      var out = [];
      arr.forEach(function (it, k) {
        if (it.off) return;
        var nm = 'book/page-' + (pageIndex + 1) + '/' +
                 (it.name || ('frame-' + (k + 1) + '.png'));
        var u = (mode === 'preview') ? (it.url || '') : nm;
        if (u) out.push(u);
      });
      return out;
    }

    out.push({
      kind: 'cover',
      src: srcOf(b.cover, 'cover' + extOfName(b.cover && b.cover.name)),
      items: [], title: '封面'
    });

    (b.pages || []).forEach(function (p, i) {
      out.push({
        kind: 'page',
        src: srcOf(p, 'page-' + (i + 1) + extOfName(p && p.name)),
        items: itemsOf(p, i),
        title: '第 ' + (i + 1) + ' 页'
      });
    });

    out.push({
      kind: 'back',
      src: srcOf(b.back, 'back' + extOfName(b.back && b.back.name)),
      items: [], title: '封底'
    });

    return out;
  }

  /* ---------- CSS ---------- */
  function buildCss(state) {
    var p = state.params || {};
    /* 尺寸适配：跟随封面图时，把「书高」按封面的真实宽高比换算，
       这样封面、内页都能铺满画布，四周不留空白。 */
    var _p = state.params || {};
    var _cov = (state.book && state.book.cover) || null;
    var _fit = (_p.bookFit !== 'manual') && _cov && _cov.w && _cov.h;
    var W = _p.bookW || 900, H = _p.bookH || 1200;
    if (_fit) { H = Math.max(1, Math.round(W * _cov.h / _cov.w)); }
    var bg = p.bookBg || '#2a2118';
    /* 锚点（.dot，点页面开 360 时那个脉冲圆点）的尺寸与颜色写死在这里：
       面板上没有对应参数，原先的 p.bookDotSize / p.bookDotColor 永远只会
       取到默认值 —— 「代码里像可配、界面里却改不了」的遗留，已清理成常量。 */
    var dot = 16;
    var dotColor = '#ffb340';
    var R = (W / H).toFixed(4);
    /* 按屏幕宽高等比铺满：两轴同时受 100vw / 100vh 约束，
       取更小的那个 → 整本书永远完整可见（不裁切、不变形）。
       适配后多出来的位置就是背景色（html/body 已铺 bg）。
       原先还扣了 120px 给底部导航，导致下面空出一大条 —— 已去掉，
       导航改为半透明浮层，压在书上而不占版面。 */
    var size = 'width:min(100vw, calc(100vh * ' + R + '));' +
               'height:min(100vh, calc(100vw / ' + R + '));';

    return [
      'html,body{margin:0;padding:0;height:100%;overflow:hidden;background:' + bg + ';',
      '  font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;}',
      'body{display:grid;place-items:center;}',

      '/* 书桌背景 */',
      '.desk{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,',
      '  rgba(255,255,255,.09) 0%, rgba(0,0,0,.55) 78%), ' + bg + ';}',

      '/* 书本 */',
      '.book-wrap{position:relative;z-index:2;display:grid;place-items:center;}',
      '.book-shell{position:relative;' + size + 'border-radius:2px;',
      '  box-shadow:0 18px 46px rgba(0,0,0,.5);}',
      '.book{position:absolute;inset:0;}',
      '/* 翻动页的背面现在由翻页库着色（纸背颜色 = 参数「纸背颜色」），',
      '   不再铺「淡化版当前页」那一层（老方案要补丁改库的清屏才做得出）。 */',
      '.book::after{ /* 书脊投影 */',
      '  content:"";position:absolute;left:0;top:0;bottom:0;width:26px;z-index:60;',
      '  background:linear-gradient(to right, rgba(0,0,0,.40), rgba(0,0,0,0));',
      '  pointer-events:none;border-radius:2px 0 0 2px;}',

      '/* 静止页 */',
      '.sheet{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;',
      '  display:block;user-select:none;-webkit-user-drag:none;background:' + bg + ';}',
      '.sheet.hide{visibility:hidden;}',
      '.ph{position:absolute;inset:0;display:grid;place-items:center;',
      '  color:#b9ae9c;background:#f7f4ee;font-size:15px;letter-spacing:1px;}',
      '.ph.hide{display:none;}',

      '/* 翻动中的弯曲纸页',
      '   canvas 属于「替换元素」：只写 inset:0 而 width/height 是 auto 时，',
      '   它用自身的 width/height 属性当显示尺寸。高分屏下我们放大了',
      '   backing store，若不显式写 100%，整个画布会跟着被放大出界。 */',

      '.dots{position:absolute;inset:0;z-index:40;pointer-events:none;}',
      '.dots.hide{display:none;}',
      '.dot{position:absolute;width:' + dot + 'px;height:' + dot + 'px;border-radius:50%;',
      '  background:' + dotColor + ';border:2px solid #fff;cursor:pointer;',
      '  pointer-events:auto;transform:translate(-50%,-50%);',
      '  box-shadow:0 0 0 0 ' + dotColor + 'cc, 0 2px 6px rgba(0,0,0,.35);',
      '  animation:dotPulse 2s infinite;}',
      '@keyframes dotPulse{',
      '  0%{box-shadow:0 0 0 0 ' + dotColor + 'cc, 0 2px 6px rgba(0,0,0,.35);}',
      '  70%{box-shadow:0 0 0 ' + Math.round(dot * 0.9) + 'px rgba(0,0,0,0), 0 2px 6px rgba(0,0,0,.35);}',
      '  100%{box-shadow:0 0 0 0 rgba(0,0,0,0), 0 2px 6px rgba(0,0,0,.35);}}',
      '.dot:hover{transform:translate(-50%,-50%) scale(1.25);}',
      '.dot.off{background:#8d8478;cursor:not-allowed;animation:none;opacity:.5;}',
      '.dot .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);',
      '  background:rgba(24,18,12,.92);color:#fff;font-size:12px;padding:4px 10px;',
      '  border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;}',
      '.dot:hover .tip{opacity:1;}',
      '.dot.off .tip::after{content:" （未上传 360）";color:#c9bda9;}',

      '/* 左右翻页热区 */',
      '.corner{position:absolute;bottom:0;width:22%;height:26%;z-index:50;cursor:pointer;}',
      '.corner.prev{left:0;}',
      '.corner.next{right:0;}',

      '/* 页码导航 */',
      '.book-nav{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;',
      '  display:flex;align-items:center;gap:14px;color:#e8dccb;font-size:14px;',
      '  background:rgba(0,0,0,.42);padding:8px 16px;border-radius:999px;',
      '  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}',
      '.book-nav button{border:0;background:rgba(255,255,255,.14);color:#fff;width:32px;',
      '  height:32px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;}',
      '.book-nav button:hover{background:rgba(255,255,255,.3);}',
      '.book-nav button:disabled{opacity:.3;cursor:not-allowed;}',

      '/* 360 弹层：盖在书页位置上，按书尺寸同比例适配 */',
      '.lot-modal{position:fixed;inset:0;z-index:9998;display:none;',
      '  background:rgba(0,0,0,' + (p.boguMask2 === undefined ? .72 : p.boguMask2) + ');}',
      '.lot-modal.on{display:grid;place-items:center;animation:lotFade .2s ease;}',
      '@keyframes lotFade{from{opacity:0}to{opacity:1}}',
      '/* 舞台就是整个屏幕。',
      '   grid-template-* 必须写死：不写的话 grid 行高由内容决定，',
      '   而查看器的 aspect-ratio 会把这一行撑到几千 px，',
      '   连带的 height:100% 也变成那个高度 —— 图片上下被裁掉。 */',
      '.lot-stage{width:100vw;height:100vh;display:grid;place-items:center;',
      '  grid-template-columns:100%;grid-template-rows:100%;position:relative;}',
      '/* CI360 会给容器设 CSS aspect-ratio 并按它撑高（实测 2493px）。',
      '   这里统一压回 100%，尺寸交给舞台；图片本身由下面 canvas 的',
      '   object-fit:contain 居中缩放 —— 完整可见、不变形。 */',
      '.lot-stage .cloudimage-360{width:100% !important;height:100% !important;',
      '  aspect-ratio:auto !important;max-height:100% !important;}',
      '.lot-stage .cloudimage-360-inner-box{width:100% !important;height:100% !important;',
      '  aspect-ratio:auto !important;}',
      '/* 「第 x 页」标题不再显示：弹层里看的是拍品，页号是多余干扰 */',
      '.lot-stage .lot-title{display:none;}',
      '.lot-stage .cloudimage-360 img{object-fit:contain;}',
      /* 画布尺寸交给容器（width/height:100%），显示比例由 object-fit 决定：
         默认 contain —— 素材完整可见、不变形；
         一旦放大，openSheet360 里的 _applyFit 会把 object-fit 换成 cover，
         让放大的画面铺满整个屏幕。
         为什么不能只写一条固定 CSS：CI360 按「容器宽 x 素材宽高比」建画布，
         1:1 素材就是正方形，在更宽的舞台上按素材比例显示时左右必然留空。 */
      '.lot-stage .cloudimage-360 canvas{width:100% !important;height:100% !important;',
      '  object-fit:contain;display:block;}',
      '/* 360 的初始图标（那个 360° 圆标）默认停在查看器正中、正好压住拍品，',
      '   挪到屏幕底部居中。 */',
      '.lot-stage .cloudimage-initial-icon{top:auto !important;bottom:64px !important;',
      '  left:50% !important;transform:translateX(-50%) !important;}',
      '.lot-close{position:absolute;top:22px;right:26px;z-index:5;width:40px;height:40px;border:0;',
      '  border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px;',
      '  cursor:pointer;}',
      '.lot-close:hover{background:rgba(255,255,255,.28);}',
      '.lot-hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);',
      '  color:rgba(255,255,255,.6);font-size:12px;letter-spacing:1px;z-index:9999;}',

      '@media (max-width:820px){',
      '  /* 手机上靠手势操作 —— 按钮都收起来，但底部那条操作说明要保留：',
      '     它写的就是手机手势，正是给手机用户看的 */',
      '  .book-nav button{display:none;}',
      '  .lot-close{width:34px;height:34px;font-size:17px;top:14px;right:14px;}',
      '  .book-nav{bottom:12px;font-size:13px;padding:6px 14px;}',
      '  .corner{display:none;}         /* 也去掉左右点击热区，避免误触 */',
      '  .lot-hint{font-size:11px;}',
      '}'
    ].join('\n');
  }

  /* ---------- 主体 ---------- */
  function buildBody(state, mode) {
    var sheets = sheetList(state, mode);
    var out = [];

    out.push('<div class="desk"></div>');
    out.push('<div class="book-wrap">');
    out.push('  <div class="book-shell">');
    /* 背面由翻页库着色（参数「纸背颜色」），这里不再铺淡化层 */
    out.push('    <div class="book" id="book"></div>');
    out.push('    <div class="ph hide" id="phBox">本页未上传图片</div>');
    out.push('    <div class="dots" id="dotsLayer"></div>');
    out.push('  </div>');
    out.push('</div>');

    out.push('<div class="corner prev" id="cPrev"></div>');
    out.push('<div class="corner next" id="cNext"></div>');

    if ((state.params || {}).bookShowNav !== false) {
      out.push('<div class="book-nav">');
      out.push('  <button id="navPrev" title="上一页">‹</button>');
      out.push('  <span id="navText">1 / ' + sheets.length + '</span>');
      out.push('  <button id="navNext" title="下一页">›</button>');
      out.push('</div>');
    }

    out.push('<div class="lot-modal" id="lotModal">');
    out.push('  <button class="lot-close" id="lotClose" title="关闭（Esc）">×</button>');
    out.push('  <div class="lot-stage" id="lotStage">');
    out.push('    <div class="lot-title" id="lotTitle"></div>');
    out.push('  </div>');
    out.push('</div>');
    out.push('<div class="lot-hint" id="lotHint" style="display:none">左右拖动旋转 · 双指放大缩小</div>');

    return out.join('\n');
  }

  /* ---------- 脚本 ---------- */
  function buildInit(state, mode) {
    var p = state.params || {};
    var sheets = sheetList(state, mode);
    /* 页数据 */
    var pages = sheets.map(function (sh) {
      /* items：这一页自己的 360 素材组（点这一页就弹它）
         title：弹层标题 */
      return { kind: sh.kind, src: sh.src,
               items: sh.items || [], title: sh.title || '' };
    });

    var keep = {};
    Object.keys(p).forEach(function (k) {
      if (k.indexOf('book') !== 0) keep[k] = p[k];
    });
    ['folder', 'filenameX', 'amountX', 'indexZeroBase', 'filenameY', 'amountY',
     'filenameGrid', 'imageListX', 'imageListY', 'imageListGrid'].forEach(function (k) {
      delete keep[k];
    });

    return [
      'var SHEETS = ' + SD.Codegen.safeJson(pages, false) + ';',
      'var BASE = ' + SD.Codegen.safeJson(keep, false) + ';',
      '/* 这里原本把书页比例塞给 CI360 的 aspectRatio。实测它只改容器高度',
      '   （1400 -> 1867），对画布尺寸毫无作用 —— CI360 的画布始终是',
      '   「容器宽 x 素材宽高比」。既无收益又把容器撑高，已移除。 */',
      'var INTERP = ' + (p.interp || 0) + ';',
      'var TURN = ' + (p.bookTurn || 700) + ';',
      '/* 卷边斜向 = 翻页库的铰链倾角（弧度）；纸背颜色是纯色 ——',
      '   不再是「被翻页面的淡化版」（老方案要改库的清屏才做得出）。 */',
      'var TILT = ' + (p.bookCurlTilt === undefined ? .22 : p.bookCurlTilt) + ';',
      'var BACKRGB = ' + (function (hex) {
        var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex || ''));
        if (!m) return '[0.953, 0.937, 0.902]';
        return '[' + [1, 2, 3].map(function (i) {
          return (parseInt(m[i], 16) / 255).toFixed(3);
        }).join(', ') + ']';
      })(p.bookBackTone || '#f3efe6') + ';',
      '/* 拖拽跟手 / 提交阈值 / 循环 / 预载页数：都来自参数面板 */',
      'var DRAG = ' + (p.bookDrag === false ? 'false' : 'true') + ';',
      'var COMMIT = ' + (p.bookDragCommit === undefined ? .35 : p.bookDragCommit) + ';',
      'var LOOP = ' + (p.bookLoop ? 'true' : 'false') + ';',
      'var PRELOAD = ' + (p.bookPreload === undefined ? 2 : p.bookPreload) + ';',
      '',
      'var bookEl = document.getElementById("book");',
      '/* ---------- 翻页引擎：@vysmo/flipbook（lib/vysmo-flipbook.min.js）----------',
      '   WebGL 连续曲面卷曲。前进与回翻走的是同一条卷曲管道 —— 老的 StPageFlip',
      '   在单页模式下回翻根本不卷曲（官方停更未修），只能靠合成一次手势去绕，',
      '   这里不需要了。它还原生支持拖拽跟手（dragNavigation）。',
      '   单页形态：一屏一页；canvas 铺满容器，而容器（.book-shell）已按封面比例',
      '   和屏幕算好尺寸，这里不再自己算第二遍。',
      '   注意：页面是按纹理直接铺满容器的（与老库行为一致），所以内容图要与书',
      '   尺寸同比例，否则会被拉伸。库只吃图片/canvas、不吃 DOM —— 360 锚点与',
      '   点击由上面的 .dots 层和 bookEl 上的监听承担（见文件后半段）。 */',
      'var phBox = document.getElementById("phBox");',
      'var dotsLayer = document.getElementById("dotsLayer");',
      'var navText = document.getElementById("navText");',
      '/* 只有确实有图的页才交给翻页库：缺图的页它没法渲染，直接跳过 */',
      'var PAGES = SHEETS.filter(function (s) { return !!(s && s.src); });',
      'var total = PAGES.length;',
      'var cur = 0;',
      'var busy = false;',
      'var fb = null;',
      '/* 这里原本还有个 RATIO（页面宽高比）变量 —— 那是喂给 CI360 的 aspectRatio 用的；',
      '   画布比例现在由 .book-shell 的 CSS 决定（buildCss 里按封面比例算好），',
      '   运行时用不到它，已删除。 */',
      '',
      '/* 页码、翻页按钮可用状态 */',
      'function syncNav() {',
      '  dotsLayer.innerHTML = (PAGES[cur] && PAGES[cur].dots) ? PAGES[cur].dots : "";',
      '  if (navText) navText.textContent = (cur + 1) + " / " + total;',
      '  var pv = document.getElementById("navPrev"), nx = document.getElementById("navNext");',
      '  /* 循环翻页时首尾不锁 —— 按钮永远可点 */',
      '  if (pv) pv.disabled = (!LOOP && cur === 0);',
      '  if (nx) nx.disabled = (!LOOP && cur === total - 1);',
      '}',
      '',
      '/* 两个方向都走库的 next() / prev()：同一条卷曲管道，没有「回翻不卷」的坑。',
      '   busy 只管按钮与键盘（库内部本来就会忽略动画中的新请求，这里只是避免',
      '   连点把页码和画面搞乱）；拖拽由库自己接管，不受 busy 影响。',
      '   LOOP 打开时首尾相接，所以边界判断要让位。 */',
      'function flipNext() { if (fb && !busy && (LOOP || cur < total - 1)) fb.next(); }',
      'function flipPrev() { if (fb && !busy && (LOOP || cur > 0)) fb.prev(); }',
      '',
      'function initFlip() {',
      '  if (!total) {',
      '    /* 一页有图的都没有：只留占位提示，不建翻页器 */',
      '    if (phBox) phBox.classList.remove("hide");',
      '    if (bookEl) bookEl.style.display = "none";',
      '    syncNav();',
      '    return;',
      '  }',
      '  if (phBox) phBox.classList.add("hide");',
      '  /* 万一翻页库初始化失败，至少把原因显示出来，别留一片空白 */',
      '  try {',
      '  fb = VysmoFlipbook.createFlipbook({',
      '    container: bookEl,',
      '    pages: PAGES.map(function (s) { return s.src; }),',
      '    axis: "horizontal",        /* 从右边缘往左翻（西式书）*/',
      '    tilt: TILT,                /* 卷边斜向：斜着推进，不是整条竖边平移 */',
      '    backColor: BACKRGB,        /* 翻动页背面 = 纸背颜色（纯色）*/',
      '    flipDuration: TURN,',
      '    dragNavigation: DRAG,      /* 拖拽跟手（参数「拖拽翻页」）*/',
      '    dragCommitThreshold: COMMIT,',
      '    loop: LOOP,                /* 参数「循环翻页」*/',
      '    /* 点击留给「点页面开 360」：库不接管点击 */',
      '    clickNavigation: false,',
      '    /* 键盘也自己接（见下面的 keydown），免得和 360 弹层抢 */',
      '    keyboardNavigation: false,',
      '    /* 懒加载：只把当前页和邻近页传上 GPU，长图录也不爆显存 */',
      '    lazy: true,',
      '    preloadWindow: PRELOAD     /* 参数「预载页数」*/',
      '  });',
      '  /* change 在翻到新页后触发（同步页码/热点）；',
      '     flipstart / flipend 管忙标志与收尾。 */',
      '  fb.on("change", function (i) { cur = i; syncNav(); });',
      '  fb.on("flipstart", function () { busy = true; });',
      '  fb.on("flipend", function () { busy = false; syncNav(); });',
      '  } catch (err) {',
      '    if (phBox) {',
      '      phBox.classList.remove("hide");',
      '      phBox.textContent = "翻页器初始化失败：" + (err && err.message);',
      '    }',
      '    if (window.console) console.error("[flip] init failed:", err);',
      '  }',
      '  window.__fb = fb;   /* 诊断用：控制台可直接调 next/prev/goTo/seek */',
      '  syncNav();',
      '}',
      '',
      'var cp = document.getElementById("cPrev"), cn = document.getElementById("cNext");',
      'if (cp) cp.addEventListener("click", flipPrev);',
      'if (cn) cn.addEventListener("click", flipNext);',
      'var np = document.getElementById("navPrev"), nn = document.getElementById("navNext");',
      'if (np) np.addEventListener("click", flipPrev);',
      'if (nn) nn.addEventListener("click", flipNext);',
      'document.addEventListener("keydown", function (e) {',
      '  if (e.key === "ArrowRight") flipNext();',
      '  if (e.key === "ArrowLeft") flipPrev();',
      '  if (e.key === "Escape") closeLot();',
      '});',
      '',
      '/* ---------- 360 弹层 ---------- */',
      'var modal = document.getElementById("lotModal");',
      'var stage = document.getElementById("lotStage");',
      'var titleEl = document.getElementById("lotTitle");',
      'var hintEl = document.getElementById("lotHint");',
      '',
      '/* 显示方式的轮询句柄：弹层开着时定时同步画布的 object-fit，',
      '   关掉弹层立刻清掉（由谁驱动见 openSheet360 末尾的说明）。 */',
      'var fitTimer = null;',
      'function destroyViewer() {',
      '  if (fitTimer) { clearInterval(fitTimer); fitTimer = null; }',
      '  try {',
      '    var ci = (typeof window.CI360 === "function") ? new window.CI360() : window.CI360;',
      '    if (ci && ci.destroyAll) ci.destroyAll();',
      '  } catch (e) {}',
      '  var olds = stage.querySelectorAll(".cloudimage-360");',
      '  for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);',
      '}',
      '',
      'function closeLot() {',
      '  modal.classList.remove("on");',
      '  if (hintEl) hintEl.style.display = "none";',
      '  destroyViewer();',
      '}',
      '',
      '/* ---------- 帧插值：相邻帧交叉淡化，缓解少帧的跳跃感 ---------- */',
      'function buildInterpolated(list, n, done) {',
      '  if (!n || !list || list.length < 2) { done(list || []); return; }',
      '  var imgs = [], total = list.length, loaded = 0, failed = false;',
      '  function step() {',
      '    if (++loaded < total) return;',
      '    if (failed) { done(list); return; }',
      '    var W = imgs[0] && imgs[0].naturalWidth, H = imgs[0] && imgs[0].naturalHeight;',
      '    if (!W || !H) { done(list); return; }',
      '    var out = [];',
      '    for (var i = 0; i < total; i++) {',
      '      out.push(list[i]);',
      '      var a = imgs[i], b = imgs[(i + 1) % total];',
      '      if (!a || !b) continue;',
      '      for (var k = 1; k <= n; k++) {',
      '        var c = document.createElement("canvas");',
      '        c.width = W; c.height = H;',
      '        var g = c.getContext("2d");',
      '        g.drawImage(a, 0, 0, W, H);',
      '        g.globalAlpha = k / (n + 1);',
      '        g.drawImage(b, 0, 0, W, H);',
      '        try { out.push(c.toDataURL("image/jpeg", 0.88)); }',
      '        catch (e) { done(list); return; }',
      '      }',
      '    }',
      '    done(out);',
      '  }',
      '  for (var i = 0; i < total; i++) {',
      '    (function (idx) {',
      '      var im = new Image();',
      '      im.onload = function () { imgs[idx] = im; step(); };',
      '      im.onerror = function () { failed = true; step(); };',
      '      im.src = list[idx];',
      '    })(i);',
      '  }',
      '}',
      'function openSheet360(sh) {',
      '  if (!sh || !sh.items || !sh.items.length) return;   /* 本页没素材 → 不响应 */',
      '  var lot = { x: sh.items, y: [], title: sh.title || "" };',
      '  destroyViewer();',
      '  titleEl.textContent = lot.title;',
      '  modal.classList.add("on");',
      '  /* 操作说明按设备给：手机上缩放靠双指；电脑上是滚轮 / 双击。',
      '     SIMPLE_UI = 触摸屏或窄屏（和上面 zoomControls 用的是同一个判断）。 */',
      '  if (hintEl) {',
      '    hintEl.textContent = SIMPLE_UI',
      '      ? "左右拖动旋转 · 双指放大缩小"',
      '      : "左右拖动旋转 · 滚轮 / 双击缩放";',
      '    hintEl.style.display = "";',
      '  }',
      '',
      '  var cfg = {};',
      '  for (var k in BASE) cfg[k] = BASE[k];',
      '  var _go = function (xlist) {',
      '  if (xlist && xlist.length) { cfg.imageListX = xlist; cfg.amountX = xlist.length; }',
      '  if (lot.y && lot.y.length) { cfg.imageListY = lot.y; cfg.amountY = lot.y.length; }',
      '  /* 不主动塞 aspectRatio：实测它只改容器高度、对画布尺寸无效。',
      '     画布尺寸由 CI360 按「容器宽 x 素材宽高比」决定，显示比例交给 object-fit。 */',
      '  /* CI360 自带的操作提示都是英文（Drag to rotate / Double-click to zoom /',
      '     Ctrl + scroll），跟弹层底部那条中文说明并排会中英混杂。',
      '     这里一律关掉，只保留中文说明。 */',
      '  cfg.hints = false;',
      '  cfg.scrollHint = false;',
      '  if (SIMPLE_UI) {',
      '    cfg.zoomControls = false;   /* 手机上不显示缩放按钮组，纯手势操作 */',
      '  }',
      '',
      '  var el = document.createElement("div");',
      '  el.className = "cloudimage-360";',
      '  el.id = "lotViewer";',
      '  stage.appendChild(el);',
      '  var ci = (typeof window.CI360 === "function") ? new window.CI360() : window.CI360;',
      '  /* init() 的返回值就是查看器实例（isZoomed 挂在它上面）。',
      '     不用配置回调 onZoomIn/onZoomChange：那是 CI360 的原型内部方法',
      '     （负责取消惯性、显隐控件），覆盖掉会破坏它自己的行为。 */',
      '  var viewer = null;',
      '  try { viewer = ci.init(el, cfg); } catch (e) { titleEl.textContent = "加载失败：" + e.message; }',
      '  /* 画布显示方式按缩放状态切换。',
      '     为什么必须切换：CI360 按「容器宽 x 素材宽高比」建画布 —— 1:1 的素材',
      '     就是正方形（实测 1400x1400），而舞台是整屏（1400x780，更宽）。',
      '     一直按素材比例 contain 居中显示，放大后画面只会占据屏幕中间一块、',
      '     左右留空 —— 也就是「放大时没有铺满整个屏幕」。所以：',
      '       未放大 -> contain：素材完整可见、不变形；',
      '       已放大 -> cover  ：铺满整个屏幕。放大本就是看局部，被裁掉的部分',
      '                        可以拖动平移补看（CI360 的 zoomPan 已支持）。',
      '     是否放大取自查看器实例的 isZoomed，见下面的 _isZoomed()。 */',
      '  /* 当前是否处于放大状态。只认查看器实例上的 isZoomed（实测：初始为',
      '     null、放大后为 true）；读不到就返回 null 表示「不确定」—— 调用方',
      '     遇到 null 一律不动，免得把已经正确的状态覆盖掉。 */',
      '  function _isZoomed() {',
      '    try {',
      '      if (viewer && typeof viewer.isZoomed === "boolean") return viewer.isZoomed;',
